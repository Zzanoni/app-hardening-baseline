name: Contract check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install LibreOffice (formula recalculation)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc

      - name: Check workbook <-> contract consistency
        run: python scripts/check_contract.py --recalc

      - name: Workbook regression tests
        run: python -m unittest discover -s tests -v
