# Characterization keys — contract v2.0.0
#
# Every question of the two characterization sheets of
# templates/ASVS_Master_Hardening_Template.xlsx, one entry per key.
#
# - Keys on "Extended Characterization": this file is the SOURCE. scripts/migrate_v2.py builds
#   that sheet (rows, dropdowns, Applicable/Status formulas) from it.
# - Keys on "Characterization Form" (v1): described here and VERIFIED against the sheet by
#   scripts/check_contract.py. Change the sheet only through a migration script.
#
# Field reference
#   key        UPPER_SNAKE key. Also the workbook-level named range of the answer cell (column D).
#   sheet      Sheet holding the question.
#   section    Section id (see `sections`), Extended Characterization only.
#   question   Question text (column B).
#   type       choice | text | long_text | date
#   options    Allowed answers for `choice` (exact strings, in dropdown order).
#   options_extra  For archetype questions: the options appended after the archetype names.
#   options_label  Human-readable options text shown in column C, when the list is too long.
#   list       Named range on the hidden `_lists` sheet feeding the dropdown (Extended only;
#              v1 dropdowns are inline lists).
#   mandatory  true/false.
#   shown_when Condition (see conditions below); omitted = always shown.
#   help       Notes / Help text (column E).
#   gates      ASVS chapters this answer gates in `Master Template` (v1 keys only).
#   feeds      Computed named ranges this answer feeds.
#   used_by    Consumers: hardening (this workbook / hardening record), threat_model (threat engine).
#
# Conditions (same syntax as the threat engine)
#   { KEY: "value" }                      KEY equals value
#   { any_of: { KEY: ["a", "b"] } }       KEY equals one of the values
#   { not: <condition> }                  negation
#   { all_of: [<condition>, ...] }        every condition holds
#   A mapping with several entries means all of them must hold.
#   The answer of a key whose own row is not applicable is treated as BLANK when evaluating any
#   condition (so a stale answer hidden by a changed sourcing model never leaks into another row).

contract_version: "2.0.0"

answer_sets:
  YN: &YN ["Yes", "No"]
  YND: &YND ["Yes", "No", "Don't know"]

sections:
  - {id: A, title: "Application identification"}
  - {id: B, title: "Business"}
  - {id: C, title: "Sourcing model"}
  - {id: D, title: "Architecture archetype"}
  - {id: E, title: "Users and admin access"}
  - {id: F, title: "Authentication"}
  - {id: G, title: "Authorization and tenancy"}
  - {id: H, title: "Data flows"}
  - {id: J, title: "Hosting"}
  - {id: K, title: "COTS and vendor"}
  - {id: L, title: "Logging and monitoring"}
  - {id: M, title: "Final"}

keys:
  # ---------------------------------------------------------------- Characterization Form (v1)
  - key: APP_NAME
    sheet: Characterization Form
    question: "Application name"
    type: text
    mandatory: true
    help: "Free text — identifies the application being assessed."
    used_by: [hardening, threat_model]

  - key: TARGET_LEVEL
    sheet: Characterization Form
    question: "Target ASVS verification level for this application"
    type: choice
    options: ["L1", "L2", "L3"]
    mandatory: true
    help: "L1 = baseline, automatable, applies to every application. L2 = standard for applications handling sensitive data (recommended corporate default). L3 = high-assurance applications (financial, health, critical infrastructure). This gates which requirement LEVELS are in scope, in addition to chapter gating."
    feeds: [TARGET_LEVEL_NUM]
    used_by: [hardening]

  - key: API_EXPOSED
    sheet: Characterization Form
    question: "Does the application expose an API (REST/GraphQL/WebSocket/RPC) for external or service-to-service consumption?"
    type: choice
    options: *YN
    mandatory: true
    help: "Gates ASVS Chapter V4 (API and Web Service). Includes internal APIs consumed by other teams/services."
    gates: [{chapter: V4, when: {API_EXPOSED: "Yes"}}]
    used_by: [hardening, threat_model]

  - key: SPA_FRONTEND
    sheet: Characterization Form
    question: "Does the application have a client-side front end (SPA) that executes logic in the user's browser?"
    type: choice
    options: *YN
    mandatory: true
    help: "Gates ASVS Chapter V3 (Web Frontend Security). Distinct from pure server-side rendering."
    gates: [{chapter: V3, when: {SPA_FRONTEND: "Yes"}}]
    used_by: [hardening, threat_model]

  - key: SESSION_STATEFUL
    sheet: Characterization Form
    question: "Does the application maintain server-side stateful sessions (session ID + store)?"
    type: choice
    options: *YN
    mandatory: true
    help: "Gates ASVS Chapter V7 (Session Management) when 'Yes', and Chapter V9 (Self-contained Tokens) when 'No' (i.e., a stateless/JWT-only model)."
    gates:
      - {chapter: V7, when: {SESSION_STATEFUL: "Yes"}}
      - {chapter: V9, when: {SESSION_STATEFUL: "No"}}
    used_by: [hardening, threat_model]

  - key: FILE_HANDLING
    sheet: Characterization Form
    question: "Does the application handle file upload, storage, or download of user-provided files?"
    type: choice
    options: *YN
    mandatory: true
    help: "Gates ASVS Chapter V5 (File Handling)."
    gates: [{chapter: V5, when: {FILE_HANDLING: "Yes"}}]
    used_by: [hardening, threat_model]

  - key: OAUTH_OIDC_USED
    sheet: Characterization Form
    question: "Does the application use OAuth 2.0 or OpenID Connect, in any role (client, authorization server, resource server, or OpenID Provider)?"
    type: choice
    options: *YN
    mandatory: true
    help: "Gates ASVS Chapter V10 (OAuth and OIDC). Enterprise SSO via OIDC/SAML counts as 'Yes'."
    gates: [{chapter: V10, when: {OAUTH_OIDC_USED: "Yes"}}]
    used_by: [hardening, threat_model]

  - key: DATA_SENSITIVITY
    sheet: Characterization Form
    question: "Data classification the application stores or processes"
    type: choice
    options: ["None", "Internal", "Confidential", "Regulated"]
    mandatory: true
    help: "Gates ASVS Chapter V14 (Data Protection) when 'Confidential' or 'Regulated'. Regulated = PII, PCI, PHI, financial, or other regulated data. Also feeds the Application Risk Tier used to compute per-item Criticality (see rows 17-22 and the Criticality Matrix below)."
    gates: [{chapter: V14, when: {any_of: {DATA_SENSITIVITY: ["Confidential", "Regulated"]}}}]
    feeds: [DATA_SENSITIVITY_SCORE, APP_RISK_SCORE, APP_RISK_TIER]
    used_by: [hardening, threat_model]

  - key: WEBRTC_USED
    sheet: Characterization Form
    question: "Does the application use WebRTC (real-time audio/video/data channels)?"
    type: choice
    options: *YN
    mandatory: true
    help: "Gates ASVS Chapter V17 (WebRTC)."
    gates: [{chapter: V17, when: {WEBRTC_USED: "Yes"}}]
    used_by: [hardening, threat_model]

  - key: EXPOSURE
    sheet: Characterization Form
    question: "Network exposure of the application"
    type: choice
    options: ["Internal only", "Partner/B2B network", "Public internet"]
    mandatory: true
    help: "Informational for risk tiering only (does not gate any ASVS chapter). Public internet = reachable by unauthenticated external users. Partner/B2B = reachable only by authenticated external organizations/services. Internal only = reachable solely from the corporate network."
    feeds: [EXPOSURE_SCORE, APP_RISK_SCORE, APP_RISK_TIER]
    used_by: [hardening, threat_model]

  - key: BUSINESS_IMPACT
    sheet: Characterization Form
    question: "Business impact if this application is breached or made unavailable"
    type: choice
    options: ["Low", "Medium", "High", "Critical"]
    mandatory: true
    help: "Informational for risk tiering only (does not gate any ASVS chapter). Consider revenue impact, safety impact, regulatory/legal penalty exposure, and reputational impact. When in doubt, use the company's existing business-impact or data-classification tier for this application if one already exists."
    feeds: [BUSINESS_IMPACT_SCORE, APP_RISK_SCORE, APP_RISK_TIER]
    used_by: [hardening, threat_model]

  # ---------------------------------------------------------- Extended Characterization (v2)
  # A. Application identification
  - key: APP_ID
    sheet: Extended Characterization
    section: A
    question: "Application ID in the CMDB / inventory"
    type: text
    mandatory: true
    used_by: [hardening, threat_model]

  - key: APP_DESCRIPTION
    sheet: Extended Characterization
    section: A
    question: "What does the application do, and for whom?"
    type: long_text
    mandatory: true
    help: "Plain language."
    used_by: [hardening, threat_model]

  - key: BUSINESS_OWNER
    sheet: Extended Characterization
    section: A
    question: "Business owner (name / area)"
    type: text
    mandatory: true
    used_by: [hardening, threat_model]

  - key: TECHNICAL_OWNER
    sheet: Extended Characterization
    section: A
    question: "Technical owner (name / team)"
    type: text
    mandatory: true
    used_by: [hardening, threat_model]

  - key: LIFECYCLE_STATUS
    sheet: Extended Characterization
    section: A
    question: "Lifecycle status"
    type: choice
    options: ["In development", "In production", "Legacy (no new features)", "Being decommissioned"]
    list: LIST_LIFECYCLE_STATUS
    mandatory: true
    used_by: [hardening, threat_model]

  # B. Business
  - key: FINANCIAL_TRANSACTIONS
    sheet: Extended Characterization
    section: B
    question: "Does it initiate, approve or change financial transactions or payments?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    help: "Drives fraud / business-logic abuse threats."
    used_by: [hardening, threat_model]

  # C. Sourcing model
  - key: SOURCING_MODEL
    sheet: Extended Characterization
    section: C
    question: "How is the application built and run?"
    type: choice
    options:
      - "In-house (we develop it)"
      - "COTS (vendor product on our infrastructure)"
      - "COTS with customizations"
      - "Vendor appliance (physical/virtual)"
      - "SaaS (vendor infrastructure)"
    list: LIST_SOURCING_MODEL
    mandatory: true
    help: "SaaS is out of scope of the v1 threat archetypes and always goes to Security review."
    used_by: [hardening, threat_model]

  # D. Architecture archetype
  - key: ARCHETYPE_PRIMARY
    sheet: Extended Characterization
    section: D
    question: "Which pattern best describes the application?"
    type: choice
    options:
      - "Internal web application"
      - "Public web application / portal"
      - "API for partners"
      - "Internal API / service"
      - "Mobile app backend"
      - "Batch / file integration"
      - "Asynchronous / event processing"
      - "Vendor product hosted by us"
      - "Vendor product with our customizations"
      - "Vendor appliance"
      - "None of these fits"
    options_extra: ["None of these fits"]  # appended to the archetype names (contract/archetypes.yml)
    list: LIST_ARCHETYPE_PRIMARY
    options_label: "One pattern from the 'Archetypes' sheet, or 'None of these fits'"
    mandatory: true
    help: "See the 'Archetypes' sheet for descriptions."
    used_by: [hardening, threat_model]

  - key: ARCHETYPE_SECONDARY
    sheet: Extended Characterization
    section: D
    question: "Does it also match a second pattern?"
    type: choice
    options:
      - "Internal web application"
      - "Public web application / portal"
      - "API for partners"
      - "Internal API / service"
      - "Mobile app backend"
      - "Batch / file integration"
      - "Asynchronous / event processing"
      - "Vendor product hosted by us"
      - "Vendor product with our customizations"
      - "Vendor appliance"
      - "No second pattern"
    options_extra: ["No second pattern"]  # appended to the archetype names (contract/archetypes.yml)
    list: LIST_ARCHETYPE_SECONDARY
    options_label: "One pattern from the 'Archetypes' sheet, or 'No second pattern'"
    mandatory: false
    used_by: [hardening, threat_model]

  - key: ARCHETYPE_DEVIATION
    sheet: Extended Characterization
    section: D
    question: "Does it have relevant components or flows not described by the selected pattern(s)?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    help: "e.g., an extra external integration, a component the pattern doesn't show."
    used_by: [hardening, threat_model]

  - key: ARCHETYPE_DEVIATION_DETAILS
    sheet: Extended Characterization
    section: D
    question: "Describe what is different"
    type: long_text
    mandatory: true
    shown_when: {ARCHETYPE_DEVIATION: "Yes"}
    used_by: [hardening, threat_model]

  # E. Users and admin access
  - key: USERS_CUSTOMERS
    sheet: Extended Characterization
    section: E
    question: "Is it used by customers (end users outside the company)?"
    type: choice
    options: *YN
    list: LIST_YN
    mandatory: true
    used_by: [hardening, threat_model]

  - key: USERS_EMPLOYEES
    sheet: Extended Characterization
    section: E
    question: "Is it used by employees?"
    type: choice
    options: *YN
    list: LIST_YN
    mandatory: true
    used_by: [hardening, threat_model]

  - key: USERS_PARTNERS
    sheet: Extended Characterization
    section: E
    question: "Is it used by partner organizations?"
    type: choice
    options: *YN
    list: LIST_YN
    mandatory: true
    used_by: [hardening, threat_model]

  - key: ADMIN_INTERFACE
    sheet: Extended Characterization
    section: E
    question: "Does it have an administration interface or console?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    used_by: [hardening, threat_model]

  - key: ADMIN_INTERFACE_REACH
    sheet: Extended Characterization
    section: E
    question: "From where can the admin interface be reached?"
    type: choice
    options: ["Internet", "Internal network", "Restricted management network / jump host only"]
    list: LIST_ADMIN_INTERFACE_REACH
    mandatory: true
    shown_when: {ADMIN_INTERFACE: "Yes"}
    used_by: [hardening, threat_model]

  # F. Authentication
  - key: AUTH_CORPORATE_SSO
    sheet: Extended Characterization
    section: F
    question: "Do users log in with corporate SSO?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    used_by: [hardening, threat_model]

  - key: AUTH_LOCAL_CREDENTIALS
    sheet: Extended Characterization
    section: F
    question: "Does the application keep its own usernames/passwords?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    used_by: [hardening, threat_model]

  - key: AUTH_MFA
    sheet: Extended Characterization
    section: F
    question: "Is MFA required for user login?"
    type: choice
    options: ["Yes, for all users", "Only for admins", "No", "Don't know"]
    list: LIST_AUTH_MFA
    mandatory: true
    used_by: [hardening, threat_model]

  - key: API_AUTH
    sheet: Extended Characterization
    section: F
    question: "How do systems authenticate to its APIs?"
    type: choice
    options: ["OAuth2 / OIDC tokens", "API key", "mTLS (client certificate)", "Basic auth", "No authentication", "Other"]
    list: LIST_API_AUTH
    mandatory: true
    shown_when: {API_EXPOSED: "Yes"}
    used_by: [hardening, threat_model]

  - key: SERVICE_ACCOUNTS
    sheet: Extended Characterization
    section: F
    question: "Does it use service accounts / technical users to access other systems?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    used_by: [hardening, threat_model]

  # G. Authorization and tenancy
  - key: MULTIPLE_ROLES
    sheet: Extended Characterization
    section: G
    question: "Are there different user roles / permission levels?"
    type: choice
    options: *YN
    list: LIST_YN
    mandatory: true
    used_by: [hardening, threat_model]

  - key: MULTI_TENANT
    sheet: Extended Characterization
    section: G
    question: "Does one instance serve multiple separate clients/organizations whose data must be isolated?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    used_by: [hardening, threat_model]

  # H. Data flows
  - key: FILE_EXCHANGE
    sheet: Extended Characterization
    section: H
    question: "Does it exchange files in batch (SFTP, shared folder, object storage)?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    help: "Different from user upload (FILE_HANDLING)."
    used_by: [hardening, threat_model]

  - key: MESSAGING
    sheet: Extended Characterization
    section: H
    question: "Does it publish or consume messages/events (queues, topics)?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    used_by: [hardening, threat_model]

  - key: OUTBOUND_EXTERNAL_CALLS
    sheet: Extended Characterization
    section: H
    question: "Does it call services outside the company (third-party APIs, internet)?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    used_by: [hardening, threat_model]

  - key: STORES_THIRD_PARTY_SECRETS
    sheet: Extended Characterization
    section: H
    question: "Does it store credentials, keys or tokens used to access other systems?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    used_by: [hardening, threat_model]

  - key: EXTERNAL_INTEGRATIONS_LIST
    sheet: Extended Characterization
    section: H
    question: "Main integrations (system + direction)"
    type: long_text
    mandatory: false
    used_by: [hardening, threat_model]

  # J. Hosting
  - key: HOSTING
    sheet: Extended Characterization
    section: J
    question: "Where does it run?"
    type: choice
    options: ["On-premises data center", "Public cloud", "Hybrid"]
    list: LIST_HOSTING
    mandatory: true
    shown_when: &NOT_SAAS {not: {SOURCING_MODEL: "SaaS (vendor infrastructure)"}}
    used_by: [hardening, threat_model]

  - key: CONTAINERIZED
    sheet: Extended Characterization
    section: J
    question: "Does it run in containers (Kubernetes, OpenShift, etc.)?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    shown_when: *NOT_SAAS
    used_by: [hardening, threat_model]

  - key: WAF_IN_FRONT
    sheet: Extended Characterization
    section: J
    question: "Is there a WAF or API gateway in front of it?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    shown_when: {not: {EXPOSURE: "Internal only"}}
    used_by: [hardening, threat_model]

  - key: OPENAPI_AVAILABLE
    sheet: Extended Characterization
    section: J
    question: "Is an OpenAPI/Swagger specification available?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: false
    shown_when: {API_EXPOSED: "Yes"}
    help: "Hook for future automatic enrichment."
    used_by: [hardening, threat_model]

  - key: IAC_AVAILABLE
    sheet: Extended Characterization
    section: J
    question: "Is the infrastructure defined as code (Terraform, etc.)?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: false
    shown_when: *NOT_SAAS
    help: "Hook for future automatic enrichment."
    used_by: [hardening, threat_model]

  # K. COTS and vendor
  - key: VENDOR_NAME
    sheet: Extended Characterization
    section: K
    question: "Vendor and product name"
    type: text
    mandatory: true
    shown_when: &COTS
      any_of:
        SOURCING_MODEL:
          - "COTS (vendor product on our infrastructure)"
          - "COTS with customizations"
          - "Vendor appliance (physical/virtual)"
    used_by: [hardening, threat_model]

  - key: PRODUCT_VERSION
    sheet: Extended Characterization
    section: K
    question: "Product version in use"
    type: text
    mandatory: true
    shown_when: *COTS
    used_by: [hardening, threat_model]

  - key: VENDOR_SUPPORTED
    sheet: Extended Characterization
    section: K
    question: "Is this version still supported by the vendor (not end-of-life)?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    shown_when: *COTS
    used_by: [hardening, threat_model]

  - key: PATCH_RESPONSIBILITY
    sheet: Extended Characterization
    section: K
    question: "Who applies security patches?"
    type: choice
    options: ["Vendor", "Internal team", "Shared", "Nobody defined"]
    list: LIST_PATCH_RESPONSIBILITY
    mandatory: true
    shown_when: *COTS
    used_by: [hardening, threat_model]

  - key: PATCH_SLA_DEFINED
    sheet: Extended Characterization
    section: K
    question: "Is there a defined SLA for applying security patches?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    shown_when: *COTS
    used_by: [hardening, threat_model]

  - key: VENDOR_REMOTE_ACCESS
    sheet: Extended Characterization
    section: K
    question: "Does the vendor have remote access to the environment?"
    type: choice
    options:
      - "No"
      - "Yes, on demand and controlled (approval, PAM, session recording)"
      - "Yes, permanent"
      - "Don't know"
    list: LIST_VENDOR_REMOTE_ACCESS
    mandatory: true
    shown_when: *COTS
    used_by: [hardening, threat_model]

  - key: DEFAULT_CREDENTIALS_CHANGED
    sheet: Extended Characterization
    section: K
    question: "Were all default/vendor accounts and passwords changed or disabled?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    shown_when: *COTS
    used_by: [hardening, threat_model]

  - key: CUSTOMIZATIONS
    sheet: Extended Characterization
    section: K
    question: "Did we develop customizations (plugins, scripts, extensions)?"
    type: choice
    options: *YN
    list: LIST_YN
    mandatory: true
    shown_when: *COTS
    used_by: [hardening, threat_model]

  - key: CUSTOMIZATIONS_IN_REPO
    sheet: Extended Characterization
    section: K
    question: "Is the customization code in a company repository?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    # CUSTOMIZATIONS is itself only applicable for COTS, and a non-applicable answer counts
    # as blank, so this row is also N/A outside the COTS sourcing models.
    shown_when: {CUSTOMIZATIONS: "Yes"}
    used_by: [hardening, threat_model]

  - key: SBOM_AVAILABLE
    sheet: Extended Characterization
    section: K
    question: "Does the vendor provide an SBOM / list of components?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: false
    shown_when: *COTS
    used_by: [hardening, threat_model]

  - key: VENDOR_SECURITY_EVIDENCE
    sheet: Extended Characterization
    section: K
    question: "Does the vendor provide security evidence (pentest report, SOC 2, ISO 27001)?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: false
    shown_when: *COTS
    used_by: [hardening, threat_model]

  - key: OUTBOUND_VENDOR_TELEMETRY
    sheet: Extended Characterization
    section: K
    question: "Does the product send data to the vendor (telemetry, license check, updates)?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    shown_when: *COTS
    used_by: [hardening, threat_model]

  # L. Logging and monitoring
  - key: LOG_AUTH_EVENTS
    sheet: Extended Characterization
    section: L
    question: "Does it log logins, failed logins and logouts?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    used_by: [hardening, threat_model]

  - key: LOG_ADMIN_ACTIONS
    sheet: Extended Characterization
    section: L
    question: "Does it log administrative actions and configuration changes?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    used_by: [hardening, threat_model]

  - key: LOGS_CENTRALIZED
    sheet: Extended Characterization
    section: L
    question: "Are application logs sent to the central log/monitoring platform?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    used_by: [hardening, threat_model]

  - key: HOST_EDR
    sheet: Extended Characterization
    section: L
    question: "Do the servers/containers have EDR/endpoint monitoring?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: true
    shown_when: *NOT_SAAS
    used_by: [hardening, threat_model]

  - key: HOST_FIM
    sheet: Extended Characterization
    section: L
    question: "Is file integrity monitoring enabled on the servers?"
    type: choice
    options: *YND
    list: LIST_YND
    mandatory: false
    shown_when: *NOT_SAAS
    used_by: [hardening, threat_model]

  # M. Final
  - key: KNOWN_SECURITY_CONCERNS
    sheet: Extended Characterization
    section: M
    question: "Any known security concern, past incident or pending audit finding?"
