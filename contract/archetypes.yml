# Architecture archetypes — contract v2.0.0
#
# Source for the `Archetypes` reference sheet and for the ARCHETYPE_PRIMARY / ARCHETYPE_SECONDARY
# dropdowns of `Extended Characterization`. The dropdowns show `name`; consumers map name -> id.
# Adding, removing or renaming an archetype is a contract change (bump CONTRACT_VERSION).

contract_version: "2.0.0"

archetypes:
  - id: ARCH-WEB-INTERNAL
    name: "Internal web application"
    description: "Browser application used by employees inside the company network."
  - id: ARCH-WEB-PUBLIC
    name: "Public web application / portal"
    description: "Browser application reachable from the internet (customers or public)."
  - id: ARCH-API-PARTNER
    name: "API for partners"
    description: "API consumed by external partner systems."
  - id: ARCH-API-INTERNAL
    name: "Internal API / service"
    description: "API consumed only by other internal systems."
  - id: ARCH-MOBILE-BACKEND
    name: "Mobile app backend"
    description: "Server side that supports a mobile app."
  - id: ARCH-BATCH-FILE
    name: "Batch / file integration"
    description: "Scheduled jobs exchanging files (SFTP, shared folders, storage)."
  - id: ARCH-ASYNC-MESSAGING
    name: "Asynchronous / event processing"
    description: "Consumes or produces messages or events via queues/topics."
  - id: ARCH-COTS-HOSTED-WEB
    name: "Vendor product hosted by us"
    description: "Third-party software installed and run on our infrastructure."
  - id: ARCH-COTS-CUSTOMIZED
    name: "Vendor product with our customizations"
    description: "As above, plus plugins/scripts/extensions developed by us."
  - id: ARCH-VENDOR-APPLIANCE
    name: "Vendor appliance"
    description: "Physical or virtual appliance supplied as a closed box by the vendor."
