# Workbook contract — how to read templates/ASVS_Master_Hardening_Template.xlsx without guessing.
#
# Hand-written; scripts/check_contract.py verifies every statement below against the workbook.
# Characterization keys live in characterization.yml, archetypes in archetypes.yml, the control
# catalog in controls.json (generated).
#
# Compatibility rule: readers should locate answers by NAMED RANGE (the key) and table rows by
# the ID column, never by fixed row numbers. Column letters and header rows below are stable
# within a major contract version.

contract_version: "2.0.0"
template_version: "2.0.0"
asvs_version: "5.0.0"

# Named ranges on the hidden `_meta` sheet holding the versions above.
meta_named_ranges:
  CONTRACT_VERSION: contract_version
  TEMPLATE_VERSION: template_version
  ASVS_VERSION: asvs_version

# Sheets in workbook order.
sheets:
  - name: Instructions
    state: visible
  - name: Characterization Form
    state: visible
    header_row: 4
    columns: {A: "Key (internal use)", B: "Question", C: "Possible options", D: "Answer", E: "Notes / Help"}
    answer_column: D
  - name: Extended Characterization
    state: visible
    header_row: 4
    columns:
      A: "Key"
      B: "Question"
      C: "Possible options"
      D: "Answer"
      E: "Notes / Help"
      F: "Mandatory"
      G: "Shown when"
      H: "Applicable"
      I: "Status"
    answer_column: D
    applicable_values: ["Applicable", "N/A"]
    status_values: ["OK", "Missing", "Review", "Optional", "N/A"]
  - name: Master Template
    state: visible
    header_row: 4
    first_data_row: 5
    last_data_row: 349
    id_column: A
    columns:
      A: "ASVS ID"
      B: "Chapter"
      C: "Section"
      D: "Level"
      E: "Requirement"
      F: "Applicability Condition"
      G: "Applicability Formula"
      H: "Applicable?"
      I: "Control Type"
      J: "Nature"
      K: "Verification Stage"
      L: "Coverage Status"
      M: "Tool / Evidence"
      N: "Notes"
      O: "Requirement Impact"
      P: "Criticality"
      Q: "Remediation Owner"
    # Columns A-G are a verbatim copy of OWASP ASVS 5.0.0; per-application columns are H-Q.
    verbatim_asvs_columns: [A, B, C, D, E, F, G]
  - name: Custom Controls
    state: visible
    header_row: 4
    first_data_row: 5
    last_data_row: 204
    id_column: A
    columns:
      A: "Control ID"
      B: "Category"
      C: "Sub-category"
      D: "Level"
      E: "Requirement"
      F: "Applicability Condition"
      G: "Applicability Formula"
      H: "Applicable?"
      I: "Control Type"
      J: "Nature"
      K: "Verification Stage"
      L: "Coverage Status"
      M: "Tool / Evidence"
      N: "Notes"
      O: "Requirement Impact"
      P: "Criticality"
      Q: "Remediation Owner"
  - name: Archetypes
    state: visible
    header_row: 4
    columns: {A: "Archetype ID", B: "Name", C: "Description (plain language)"}
  - name: _lists
    state: hidden
  - name: _meta
    state: hidden

# Computed named ranges (do not write to them). Every characterization key is ALSO a named range
# (see characterization.yml); those are not repeated here.
computed_named_ranges:
  TARGET_LEVEL_NUM: {ref: "'Characterization Form'!$D$17", holds: "Target level as a number (1-3; 0 if blank)"}
  DATA_SENSITIVITY_SCORE: {ref: "'Characterization Form'!$D$18", holds: "Data sensitivity score (0-3)"}
  EXPOSURE_SCORE: {ref: "'Characterization Form'!$D$19", holds: "Exposure score (0-2)"}
  BUSINESS_IMPACT_SCORE: {ref: "'Characterization Form'!$D$20", holds: "Business impact score (0-3)"}
  APP_RISK_SCORE: {ref: "'Characterization Form'!$D$21", holds: "Worst of the three scores above"}
  APP_RISK_TIER: {ref: "'Characterization Form'!$D$22", holds: "Application Risk Tier (see vocabularies.app_risk_tier)"}
  CRIT_MATRIX: {ref: "'Characterization Form'!$B$26:$E$28", holds: "Criticality matrix body"}
  CRIT_MATRIX_ROWS: {ref: "'Characterization Form'!$A$26:$A$28", holds: "Requirement Impact labels (matrix rows)"}
  CRIT_MATRIX_COLS: {ref: "'Characterization Form'!$B$25:$E$25", holds: "App Risk Tier labels (matrix columns)"}
  EXT_MISSING_COUNT: {sheet: "Extended Characterization", column: D, holds: "Number of rows with Status = Missing"}
  NEEDS_SECURITY_REVIEW: {sheet: "Extended Characterization", column: D, holds: "Yes / No — any review trigger fired"}
  REVIEW_REASONS: {sheet: "Extended Characterization", column: D, holds: "'; '-separated reasons of the fired triggers, or 'None'"}

# Closed vocabularies.
vocabularies:
  coverage_status: ["Not assessed", "Full coverage", "Partial coverage", "Gap", "N/A"]
  remediation_owner: ["Internal dev", "Configuration", "Vendor", "Compensating", "Risk acceptance"]
  app_risk_tier: ["Low", "Medium", "High", "Critical"]
  criticality: ["Low", "Medium", "High", "Critical", "N/A"]
  requirement_impact: ["Low", "Medium", "High"]
  applicable: ["Applicable", "N/A"]

# Custom Controls ID conventions.
custom_control_id_patterns:
  CUSTOM: {regex: "^CUSTOM-[0-9]{2,}$", meaning: "Organization policy / contractual / platform-specific control"}
  TMX: {regex: "^TMX-[A-Z]+-[0-9]{3}$", meaning: "Control originated by threat modeling (COTS, vendor, compensating, infrastructure)"}
# Worked-example rows shipped with the template; consumers must ignore them.
example_control_ids: ["EXAMPLE-01", "TMX-EXAMPLE-001"]

# Security review triggers. NEEDS_SECURITY_REVIEW = "Yes" when ANY trigger fires; REVIEW_REASONS
# lists the `reason` of each fired trigger, in this order, separated by "; ".
# Conditions use the syntax of characterization.yml (answers of non-applicable rows count as
# blank). `status_any` is true when any Extended Characterization row has that Status.
# MUST stay equal to catalog/config/review_triggers.yml in the threat modeling repository.
review_triggers:
  - id: ARCHETYPE_NONE
    when: {ARCHETYPE_PRIMARY: "None of these fits"}
    reason: "No archetype fits"
  - id: ARCHETYPE_DEVIATION
    when: {any_of: {ARCHETYPE_DEVIATION: ["Yes", "Don't know"]}}
    reason: "Components or flows outside the selected archetype (or unknown)"
  - id: SAAS
    when: {SOURCING_MODEL: "SaaS (vendor infrastructure)"}
    reason: "SaaS sourcing model (outside v1 archetypes)"
  - id: MANDATORY_DONT_KNOW
    when: {status_any: "Review"}
    reason: "Mandatory question answered Don't know"
  - id: CRITICAL_TIER
    when: {APP_RISK_TIER: "Critical"}
    reason: "Application Risk Tier is Critical"
  - id: VENDOR_REMOTE_ACCESS
    when: {any_of: {VENDOR_REMOTE_ACCESS: ["Yes, permanent", "Don't know"]}}
    reason: "Permanent or unknown vendor remote access"
  - id: VENDOR_UNSUPPORTED
    when: {any_of: {VENDOR_SUPPORTED: ["No", "Don't know"]}}
    reason: "Vendor version unsupported or support unknown"
