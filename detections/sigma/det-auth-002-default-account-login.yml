title: Login with a default or vendor account
id: f1559c65-29bc-5563-be50-cca30f59afc0
status: experimental
description: Successful login with a known default, vendor or shared account name.
author: Application Hardening Baseline
date: 2026-09-26
tags:
  - attack.initial-access
  - attack.t1078.001
logsource:
  category: authentication
  product: application
detection:
  selection:
    event.outcome: success
    user.name:
      - admin
      - administrator
      - root
      - sa
      - vendor
      - support
      - test
  condition: selection
fields:
  - user.name
  - source.ip
falsepositives:
  - Documented break-glass use of a default account.
level: high
